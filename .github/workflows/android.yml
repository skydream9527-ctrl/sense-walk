name: Android build and package

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub prerelease after checks pass (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source and ZCode handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Package tracked source and documentation
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=sense-walk/ --output="dist/sensewalk-source-${GITHUB_SHA::7}.zip" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sensewalk-source-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

  build:
    name: Test, lint and debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Prepare Android SDK
        run: |
          test -n "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          chmod +x gradlew
      - name: Test, lint and build with repository wrapper
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --console=plain
      - name: Release manifest guard (SW-001 F-005)
        run: |
          ./gradlew :app:processReleaseMainManifest --no-daemon --console=plain
          M=$(find app/build/intermediates/merged_manifest/release -name AndroidManifest.xml | head -1)
          echo "release merged manifest: $M"
          if grep -q "DebugStepReceiver" "$M"; then
            echo "::error::release merged manifest contains DebugStepReceiver"; exit 1
          fi
          echo "release manifest clean: debug-only smoke entries absent"
      - name: Upload installable debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sensewalk-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sensewalk-reports-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 30

  release:
    name: Optional GitHub prerelease
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
    needs: [source, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download successful build packages
        run: |
          gh run download "$GITHUB_RUN_ID" --name "sensewalk-apk-$GITHUB_SHA" --dir dist
          gh run download "$GITHUB_RUN_ID" --name "sensewalk-source-$GITHUB_SHA" --dir dist
      - name: Publish APK and source package
        run: |
          TASK_RELEASE_TAG="build-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          cat > dist/release-notes.md <<NOTES
          SenseWalk development build. Debug APK and tracked source/ZCode handoff bundle.

          Commit: $GITHUB_SHA
          Checks: JVM test task, Android lint and debug build.
          Source: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          This is an implementation preview. Physical-device and user validation are reported separately in the development plan. A test task with no test sources does not establish behavioral coverage.

          ## Audio credits

          - Footsteps: "Walking through leaves" and "leaves and sticks" by gravitysound.studio — CC BY 4.0, via Wikimedia Commons (edited into 6 footstep variants).
            - https://commons.wikimedia.org/wiki/File:Walking_through_leaves_(Gravity_Sound).wav
            - https://commons.wikimedia.org/wiki/File:Walking_through_leaves_and_sticks_(Gravity_Sound).wav
          - Deep birds: "Dawn chorus at Glencairnie" by DivyaCM — CC BY 4.0, via Wikimedia Commons (edited excerpt).
            - https://commons.wikimedia.org/wiki/File:Dawn_chorus_at_Glencairnie_big_bungalow_Craigmore_DM.ogg
          - Ambience: "Waidachswald Oberschefflenz Abend" by User:Karlunun — CC0, via Wikimedia Commons.
            - https://commons.wikimedia.org/wiki/File:Waidachswald_Oberschefflenz_Abend_20250616_2005.ogg
          - License: https://creativecommons.org/licenses/by/4.0/
          NOTES
          gh release create "$TASK_RELEASE_TAG" dist/*.apk dist/*.zip --target "$GITHUB_SHA" --prerelease --title "SenseWalk $TASK_RELEASE_TAG" --notes-file dist/release-notes.md
